name: 07 - Bienvenida a Issues - Nuevo

# Se ejecuta inmediatamente cuando alguien crea (abre) un issue
on:
  issues:
    types: [opened]

# Permiso necesario para poder comentar en el issue
permissions:
  issues: write

jobs:
  responder-issue:
    runs-on: ubuntu-latest

    steps:
      - name: Responder al nuevo issue
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const autor = context.payload.issue.user.login;
            const numero = context.payload.issue.number;
            const titulo = context.payload.issue.title;

            const mensaje = [
              `👋 ¡Hola @${autor}!`,
              ``,
              `Gracias por abrir el issue **#${numero}: "${titulo}"**.`,
              ``,
              `🕵️ Tu issue está siendo revisado por Test-Felix, nuestro agente de la Legión.`,
              `Te responderemos lo antes posible. ¡Mantente atento!`
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: numero,
              body: mensaje
            });
