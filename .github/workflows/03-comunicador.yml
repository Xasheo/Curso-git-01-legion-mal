# This is a basic workflow to help you get started with Actions

name: comunicador de la legion

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      villano:
        description: "Que villano envia el mensaje"
        required: true
        type: choice
        options:
          - Lex luthor
          - Magneto
          - Joker
      mensaje:
        description: "Mensaje para el consejo"
        required: true
        default: "Exito"
      prioridad:
        description: "nivel de prioridad"
        required: true
        type: choice
        options:
          - Normal
          - Alta
          - Critica
# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  trasmitir-mensaje:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - name: Instalar el trasnmisor de la Legion 
        run: sudo apt-get install -y cowsay

      - name: Imprimir variables
        run: |
         echo "=================================="
         echo "      TRASMISIN INTERCEPTADA" 
         echo "=================================="
         echo "DE: : ${{ inputs.villano }}"
         echo ""
         echo "Fecha $(date -u +"%d/%m/%Y - %H:%M UTC")"
         echo "------------MENSAJE---------"
         cowsay -f eyes "${{ inputs.mensaje}}"
         echo ""
         echo "-------- ${{inputs.villano}}"

